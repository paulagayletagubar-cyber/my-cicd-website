
# name: The display title for the deployment pipeline in GitHub Actions
name: CD Web Deployment Pipeline

# on: Triggers this workflow on pushes to main
on:
  push:
    branches: ["main"]

# permissions: Sets the security access controls for GitHub Actions
permissions:
  contents: read
  pages: write
  id-token: write

# jobs: Defines the deployment execution process
jobs:
  deploy:
    # Required for GitHub Pages deployment
    runs-on: ubuntu-24.04

    steps:
      # Step 1: Download repository source code
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # Step 2: Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # Step 3: Package site files into a deployment artifact
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # Step 4: Deploy the website to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
          