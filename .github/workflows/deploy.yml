# name: The display title for the deployment pipeline in GitHub Actions
name: CD Web Deployment Pipeline

# on: Triggers this workflow on pushes to main (e.g., after pull requests are merged or code is pushed)
on:
  push:
    branches: [ "main" ]

# permissions: Explicitly sets security access controls granted to the automatically generated GITHUB_TOKEN
# Without these, GitHub Actions cannot publish content to GitHub Pages on your behalf
permissions:
  contents: read       # Allows the runner to read and clone repository files
  pages: write         # Grants permission to modify and publish files to GitHub Pages
  id-token: write      # Generates an OpenID Connect (OIDC) token to securely prove the job's identity to GitHub Pages

# jobs: Defines the deployment execution process
jobs:
  deploy:
    # Environment: Executes inside a clean, hosted Ubuntu Linux virtual machine
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Download repository source code onto the runner
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      # Step 2: Configure environment settings specific to GitHub Pages deployment
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      # Step 3: Package site files into a downloadable deployment zip (called an artifact)
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'    # path: Specifies which folder to compress ('.' refers to the repository root directory)

      
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
